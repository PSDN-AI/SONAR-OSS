[[exception]]
id = "PYSEC-2026-3716"
package = "datasets"
owner = "RN0311"
rationale = "Path traversal in folder-based dataset builders (crafted filename metadata escaping the dataset dir during save_to_disk/push_to_hub). Fixed only in datasets 5.0.1; the toolkit pins <4.0.0 because 4.x switched Audio decoding to torchcodec. psdn-sonar only calls load_dataset on registry-pinned Hub IDs and never uses folder-based builders, save_to_disk, or push_to_hub, so the vulnerable path is not reachable."
review_by = "2026-10-15"
removal_condition = "Remove when the datasets pin is raised to >=5.0.1 (blocked on the torchcodec audio-decoding migration), or if a fixed 3.x backport is published."

[[exception]]
id = "PYSEC-2026-3624"
package = "lightning"
owner = "RN0311"
rationale = "Advisory's fixed version is CalVer 2022.6.15, which version-compares above the current SemVer 2.x line, so every modern lightning release is flagged. The advisory targets the deprecated 2022-era package layout; lightning is a transitive dependency of the optional [pyannote] extra only."
review_by = "2026-10-15"
removal_condition = "Remove when the advisory metadata is corrected upstream or pyannote.audio drops the lightning dependency."
