id = "PYSEC-2026-2288"
package = "transformers"
owner = "RN0311"
rationale = "Fixed only in transformers 5.0.0; the toolkit pins <5.0.0 because 5.x is a breaking major upgrade for the ASR adapters. The affected code path is not reachable from psdn-sonar's model loading."
review_by = "2026-10-15"
removal_condition = "Remove when the transformers pin is raised to >=5 (tracked as part of the post-launch dependency review)."

