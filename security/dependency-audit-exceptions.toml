# Reviewed exceptions for the blocking `Dependency audit` check (M1-SEC-01).
#
# Every entry must be exact (one advisory ID), owned, justified, and
# time-bounded. scripts/dependency_audit.py fails CI when:
#   - a vulnerability is reported that has no entry here (new finding),
#   - an entry no longer matches any reported vulnerability (obsolete —
#     remove it), or
#   - an entry's review_by date has passed (stale — re-review or remove).
#
# Adding an entry requires a PR touching this file, which makes every
# exception reviewable in history.

[[exception]]
id = "PYSEC-2025-217"
package = "transformers"
owner = "RN0311"
rationale = "ReDoS in a Transformers code path this toolkit does not call; no fixed release published for the 4.x line. transformers is pinned <5.0.0 because 5.x is a breaking major upgrade for the ASR adapters."
review_by = "2026-10-15"
removal_condition = "Remove when a fixed 4.x release exists in our constraint range, or when the transformers pin is raised to >=5."

