# Dependabot version updates — GitHub Actions ecosystem only, deliberately.
# Python dependencies are locked (uv.lock) and updated through the
# deliberate-update policy with reviewed exceptions (M1-SEC-01, issue #19,
# security/dependency-audit-exceptions.toml); automatic version-bump PRs
# would bypass that review. Dependabot security *alerts* are enabled at the
# repository level; automated security-fix PRs are off for the same reason.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
