version: 2

updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  # Actions are pinned by full commit SHA, so without Dependabot they never
  # receive CVE patches or version bumps.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # One PR per week for all non-major action bumps to limit PR volume.
      github-actions:
        update-types:
          - "minor"
          - "patch"

  # The Python (uv) ecosystem is intentionally omitted until the code import (#8)
  # adds pyproject.toml / uv.lock. Dependabot requires a manifest/lock file for an
  # ecosystem; configuring "uv" without one produces "dependency file not found"
  # errors, so the Python update config lands together with those manifests.
