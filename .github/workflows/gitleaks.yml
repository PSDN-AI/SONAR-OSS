name: Secret scanning

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate superseded PR runs, but keep every push/dispatch run as evidence.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            "$url" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # False-positive triage:
      #   1. Confirm the finding is not a real secret before doing anything else.
      #   2. If it is a false positive, add a narrowly-scoped rule/allowlist entry to
      #      .gitleaks.toml (or an inline `gitleaks:allow` comment on that exact line)
      #      rather than disabling the scan or widening the allowlist broadly.
      #   3. Never commit real secrets to silence a finding; rotate and remove instead.
      #   4. docs/import-gate.md requires a clean full-history gitleaks pass before this
      #      repo goes public, so treat every finding here as blocking until resolved.
      # `gitleaks git` scans the full commit history (requires fetch-depth: 0 above),
      # so a secret introduced in any commit is caught even if a later commit removed
      # it. A working-tree-only scan (`gitleaks dir`) would miss that case.
      - name: Run gitleaks (full commit history)
        run: gitleaks git . --redact --exit-code 1
