name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate superseded PR runs, but keep every push/dispatch run as evidence.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  internal-refs:
    name: Internal-reference gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Blocking: this repo is assembled by importing code from a private
      # repository, so every PR is checked for private-infrastructure and
      # internal-module references. See scripts/check_internal_refs.sh and
      # docs/import-gate.md.
      - name: Check for internal references
        run: ./scripts/check_internal_refs.sh

  lint-typecheck:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      # Contributor-environment contract (M1-ENV-01): install exactly the
      # committed lockfile, never a fresh resolution.
      - name: Install frozen environment
        run: uv sync --frozen --extra dev --python 3.12

      - name: Ruff lint
        run: uv run --no-sync ruff check psdn_sonar tests

      - name: Ruff format check
        run: uv run --no-sync ruff format --check psdn_sonar tests

      - name: Type check
        run: uv run --no-sync ty check psdn_sonar/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Keep every interpreter's result visible: a 3.10 failure must not mask
      # a 3.11/3.12-specific one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # Contributor-environment contract (M1-ENV-01): every supported
      # interpreter must complete a frozen sync of the committed lockfile
      # and pass the suite from that exact environment.
      - name: Install frozen environment
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v

  # Closes both coverage gaps from issue #114 with one job: the README claims
  # macOS support that no workflow validated, and no job installed the [ml]
  # extra, so the HuggingFace adapter tests skipped on every PR — no ASR model
  # adapter was exercised anywhere in CI. The [ml] install lives on the macOS
  # runner deliberately: macOS torch wheels are small CPU-only builds, while
  # the committed lockfile resolves Linux torch to the CUDA-bundled stack
  # (torch + cudnn + triton, several GB) — too heavy for PR CI when the
  # adapter tests are fully mocked and platform-independent.
  test-macos-ml:
    name: Tests (macOS arm64, Python 3.12 + [ml])
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install frozen environment with [ml]
        run: uv sync --frozen --extra dev --extra ml --python 3.12

      # The adapter tests skip via `pytest.mark.skipif(torch is None, ...)`.
      # Guard the guard: if this import ever breaks, fail loudly here instead
      # of letting the suite go green with the adapter tests silently skipped.
      - name: Verify the [ml] import surface (adapter tests must not skip)
        run: uv run --no-sync python -c "import torch, transformers; print(torch.__version__, transformers.__version__)"

      - name: Run tests
        run: uv run --no-sync pytest tests/ -v
