name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate superseded PR runs, but keep every push/dispatch run as evidence.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  internal-refs:
    name: Internal-reference gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Blocking: this repo is assembled by importing code from a private
      # repository, so every PR is checked for private-infrastructure and
      # internal-module references. See scripts/check_internal_refs.sh and
      # docs/import-gate.md.
      - name: Check for internal references
        run: ./scripts/check_internal_refs.sh

  lint-typecheck:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Ruff lint
        run: ruff check psdn_sonar tests

      - name: Ruff format check
        run: ruff format --check psdn_sonar tests

      - name: Type check
        run: ty check psdn_sonar/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Keep every interpreter's result visible: a 3.10 failure must not mask
      # a 3.11/3.12-specific one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v

  pip-audit:
    name: Dependency audit (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install project and pip-audit
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pip-audit

      # Report-only: surfaces known-vulnerable dependencies without blocking
      # PRs on pre-existing/transitive CVEs. Tightening to a blocking gate
      # (with an allowlist) is tracked in M1-SEC-01 (#19).
      - name: Audit installed dependencies
        continue-on-error: true
        run: pip-audit --desc
