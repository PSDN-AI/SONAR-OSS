name: Dependency audit

# Blocking audit of the committed uv.lock (M1-SEC-01). The audited set is the
# exported lockfile — never a fresh resolution — so the result describes
# exactly what contributors and CI install. Exceptions live in
# security/dependency-audit-exceptions.toml and fail closed when obsolete
# or past their review date (see scripts/dependency_audit.py).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories must surface without waiting for a PR.
    - cron: "35 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate superseded PR runs, but keep every push/schedule/dispatch run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      - name: Export locked dependency graph
        run: >
          uv export --frozen --format requirements-txt --all-extras
          --no-emit-project -o "$RUNNER_TEMP/requirements-audit.txt"

      - name: Audit locked dependencies against reviewed exceptions
        run: >
          uvx pip-audit==2.9.0 -r "$RUNNER_TEMP/requirements-audit.txt"
          --disable-pip --format json 2> "$RUNNER_TEMP/pip-audit.log"
          | python scripts/dependency_audit.py
          || { cat "$RUNNER_TEMP/pip-audit.log" >&2; exit 1; }
