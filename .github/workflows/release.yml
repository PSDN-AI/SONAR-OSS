name: Release

# Default-branch release via Trusted Publishing (OIDC) — no stored token
# anywhere. repository_dispatch always uses the default branch's workflow;
# the tag is untrusted data in client_payload, never the source of the
# workflow or verifier. The dispatch type selects the index:
#
#   release-testpypi -> TestPyPI, `testpypi` environment (rehearsal)
#   release-pypi     -> PyPI,     `pypi` environment (production, reviewed)
#
# The workflow filename and both environment names are load-bearing: each is
# registered in the index-side Trusted Publisher and must match exactly
# (M3-REL-02a, M3-REL-02c). Both environments must allow only the main
# branch: a deployment branch policy is matched against the GITHUB_REF of the
# run, and repository_dispatch always runs on refs/heads/main, so a tag-based
# policy rejects the deployment before it can publish.
# Maintainer trigger (see docs/RELEASING.md for the full runbook):
#   gh api --method POST repos/PSDN-AI/SONAR-OSS/dispatches \
#     -f event_type=release-testpypi -f 'client_payload[tag]=vX.Y.Z'
#   gh api --method POST repos/PSDN-AI/SONAR-OSS/dispatches \
#     -f event_type=release-pypi -f 'client_payload[tag]=vX.Y.Z'
on:
  repository_dispatch:
    types: [release-testpypi, release-pypi]

permissions: {}

concurrency:
  # One release at a time per tag, across both indexes: cancel-in-progress is
  # false, so a second dispatch for the same tag queues rather than cancels.
  # Both targets write the same tag's GitHub Release, so letting a TestPyPI
  # and a PyPI run overlap would let the loser's notes clobber the winner's.
  group: release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Forks keep the workflow file but must never attempt a release.
    if: github.repository == 'PSDN-AI/SONAR-OSS' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.gate.outputs.version }}
      source-commit: ${{ steps.gate.outputs.source-commit }}
      # Index routing, resolved once. No later job hardcodes an index.
      target: ${{ steps.gate.outputs.target }}
      index-name: ${{ steps.gate.outputs.index-name }}
      index-host: ${{ steps.gate.outputs.index-host }}
      upload-url: ${{ steps.gate.outputs.upload-url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.client_payload.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # Pinned (unlike CI): uv resolves and builds the artifact that gets
          # signed and published, so the release toolchain must not float.
          version: "0.12.1"
          # No cache on the release path: a poisoned Actions cache must not
          # be able to reach the published artifact (zizmor: cache-poisoning).
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Verify uv.lock is in sync with pyproject.toml
        run: uv lock --check

      # The version is declared in two places (pyproject.toml and
      # psdn_sonar/__init__.py). An index rejects a re-upload of any
      # version it has ever seen, so every mismatch caught here is an
      # unburnable version number saved. The tag must match both.
      - name: Release gate (tag ↔ version consistency, index routing)
        id: gate
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "::error::Release tag must start with v followed by a digit"
            exit 1
          fi

          PYPROJECT_VERSION="$(uv version --short --frozen)"
          INIT_VERSION="$(python - <<'EOF'
          import ast
          import pathlib

          tree = ast.parse(pathlib.Path("psdn_sonar/__init__.py").read_text(encoding="utf-8"))
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if getattr(target, "id", None) == "__version__":
                          print(ast.literal_eval(node.value))
                          raise SystemExit(0)
          raise SystemExit("psdn_sonar/__init__.py does not define __version__")
          EOF
          )"

          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "::error::Version drift: pyproject.toml=$PYPROJECT_VERSION psdn_sonar/__init__.py=$INIT_VERSION"
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version $TAG_VERSION does not match declared version $PYPROJECT_VERSION"
            exit 1
          fi

          # rev-list dereferences annotated tags; GITHUB_SHA is not
          # specified for that case, so record the dereferenced commit.
          SOURCE_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"

          # The dispatch type is the only thing that selects an index, and it
          # is resolved here so the gate above has already run: a mismatched
          # tag never reaches a publish job at all.
          case "$EVENT_ACTION" in
            release-pypi)
              TARGET=pypi
              INDEX_NAME=PyPI
              INDEX_HOST=pypi.org
              UPLOAD_URL=https://upload.pypi.org/legacy/
              # Production is one-way: any version number uploaded here is
              # burned forever. Development builds are rehearsal artifacts
              # and belong on TestPyPI, so refuse them before the upload.
              if printf '%s' "$PYPROJECT_VERSION" | grep -Eq '\.dev[0-9]*'; then
                echo "::error::Refusing to publish development version $PYPROJECT_VERSION to production PyPI — dispatch release-testpypi instead"
                exit 1
              fi
              ;;
            release-testpypi)
              TARGET=testpypi
              INDEX_NAME=TestPyPI
              INDEX_HOST=test.pypi.org
              UPLOAD_URL=https://test.pypi.org/legacy/
              ;;
            *)
              echo "::error::Unknown dispatch type $EVENT_ACTION"
              exit 1
              ;;
          esac

          {
            echo "version=$PYPROJECT_VERSION"
            echo "source-commit=$SOURCE_COMMIT"
            echo "target=$TARGET"
            echo "index-name=$INDEX_NAME"
            echo "index-host=$INDEX_HOST"
            echo "upload-url=$UPLOAD_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Build wheel and source distribution
        run: uv build --clear --no-sources --out-dir dist

      - name: Validate distribution metadata
        # Keep in sync with package.yml and with the twine bundled in the
        # pinned pypa/gh-action-pypi-publish (both 7.0.0): hatchling 1.32
        # emits Metadata-Version 2.5, which twine < 7 rejects.
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      # Same gate as package.yml runs on every PR, executed here against
      # the exact artifact about to be published.
      - name: Verify clean wheel installation
        env:
          SONAR_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail

          verify_dir="$RUNNER_TEMP/verify-venv"
          uv venv --python 3.10 "$verify_dir"
          uv pip install --python "$verify_dir/bin/python" dist/*.whl

          cd "$RUNNER_TEMP"
          "$verify_dir/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  verify-release-commit:
    name: Verify release commit
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.repository == 'PSDN-AI/SONAR-OSS' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out trusted release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: trusted-release-gate
          persist-credentials: false

      # This verifier comes from main, not from the candidate tag. Strict
      # position checking means any newer main commit invalidates the tag.
      - name: Verify required checks on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          python trusted-release-gate/scripts/verify_release_commit.py "$SOURCE_COMMIT" \
            --tag "$TAG" \
            --evidence "$RUNNER_TEMP/release-evidence.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

  publish:
    name: Publish to ${{ needs.build.outputs.index-name }}
    needs: [build, verify-release-commit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `pypi` carries required reviewers, so a production release waits here
    # for a named human to approve the deployment (M3-REL-02c).
    environment:
      name: ${{ needs.build.outputs.target }}
      url: https://${{ needs.build.outputs.index-host }}/project/psdn-sonar/
    permissions:
      # OIDC token for Trusted Publishing + PEP 740 attestations.
      id-token: write
      # The post-approval re-verification below reads refs and check runs.
      contents: read
      actions: read
    steps:
      # verify-release-commit runs before the environment gate, and the gate
      # holds this job for as long as a reviewer takes. Everything it proved
      # can decay during that wait — main can advance, the tag can move, a
      # required check can be re-run and go red — so the whole verification
      # runs again here, after approval and immediately before the upload.
      # An index never forgets a version: this is the last point where the
      # release can still be stopped.
      #
      # The verifier is checked out from main, which is already the source of
      # this workflow file, so running it here widens no trust boundary.
      - name: Check out trusted release verifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: trusted-release-gate
          persist-credentials: false

      - name: Re-verify the release commit after approval
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          python trusted-release-gate/scripts/verify_release_commit.py "$SOURCE_COMMIT" \
            --tag "$TAG" \
            --evidence "$RUNNER_TEMP/release-evidence.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The verifier proves the commit; this proves the tag still names it.
      - name: Re-verify the tag after approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          sha="$(jq -r '.object.sha' <<<"$ref_json")"
          otype="$(jq -r '.object.type' <<<"$ref_json")"
          # Annotated tags point at one tag object; dereference it.
          if [ "$otype" = "tag" ]; then
            sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha')"
          fi
          if [ "$sha" != "$SOURCE_COMMIT" ]; then
            echo "::error::Tag $RELEASE_TAG now points at $sha but the artifacts were built from $SOURCE_COMMIT — refusing to publish"
            exit 1
          fi

          echo "Tag $RELEASE_TAG still points at $SOURCE_COMMIT"

      # Replaces the pre-gate evidence: what the Release records must be the
      # verification the upload actually happened on.
      - name: Upload post-approval release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/release-evidence.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Publish to ${{ needs.build.outputs.index-name }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ needs.build.outputs.upload-url }}
          # True on TestPyPI only: twine uploads files sequentially, so a
          # transient failure between wheel and sdist would wedge the tag
          # (the uploaded filename is taken forever and every retry fails).
          # False on production PyPI, where a silent skip would mask a real
          # problem — recovery there is a new patch version, not a retry.
          skip-existing: ${{ needs.build.outputs.target == 'testpypi' }}
          # PEP 740 provenance, stated rather than inherited from the
          # action's default: the attestation is release evidence.
          attestations: true

  # Separate from `publish` on purpose. The upload is irreversible and
  # `skip-existing` is false on production, so a re-run of a job that had
  # already uploaded would fail permanently on "file already exists". Keeping
  # the index check in its own job means a CDN lag can be re-run on its own.
  verify-index:
    name: Verify ${{ needs.build.outputs.index-name }} serves the built artifacts
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Record artifact checksums
        run: (cd dist && sha256sum -- *) > "$RUNNER_TEMP/SHA256SUMS.txt"

      # Both indexes upload files sequentially and their JSON responses can
      # lag or briefly expose only part of a release. The release is not
      # complete until the index serves the exact files the build job made.
      - name: Compare the served files with the built artifacts
        env:
          VERSION: ${{ needs.build.outputs.version }}
          INDEX_NAME: ${{ needs.build.outputs.index-name }}
          INDEX_HOST: ${{ needs.build.outputs.index-host }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 3 --max-time 5 \
              -H 'Cache-Control: no-cache' \
              "https://$INDEX_HOST/pypi/psdn-sonar/$VERSION/json" \
              -o "$RUNNER_TEMP/release.json" &&
              python3 - <<'EOF'
          import json
          import os
          import pathlib

          release = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "release.json").read_text(encoding="utf-8"))
          published = {url["filename"]: url["digests"]["sha256"] for url in release["urls"]}

          expected = {}
          checksum_file = pathlib.Path(os.environ["RUNNER_TEMP"], "SHA256SUMS.txt")
          for line in checksum_file.read_text(encoding="utf-8").splitlines():
              digest, name = line.split(maxsplit=1)
              expected[name.strip().lstrip("*")] = digest

          if published != expected:
              print(f"Index not ready: {published}")
              print(f"Expected:        {expected}")
              raise SystemExit(1)
          EOF
            then
              echo "Published artifacts verified after $attempt attempt(s)"
              exit 0
            fi
            if [ "$attempt" -lt 60 ]; then
              sleep 20
            fi
          done
          echo "::error::$INDEX_NAME did not serve the exact build artifacts after 60 attempts"
          exit 1

  smoke-test:
    name: Smoke test from ${{ needs.build.outputs.index-name }}
    needs: [build, verify-index]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      INDEX_HOST: ${{ needs.build.outputs.index-host }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      # Download only the package wheel from the index just published to,
      # then install that local wheel with dependencies resolved only from
      # real PyPI (TestPyPI carries no usable copy of the dependency tree).
      - name: Install published package in a clean environment
        run: |
          set -euo pipefail

          python -m venv "$RUNNER_TEMP/smoke"
          PIP="$RUNNER_TEMP/smoke/bin/pip"

          mkdir "$RUNNER_TEMP/published"

          # An index serves its JSON API and its /simple/ page from separate
          # caches: verify-index can pass on its first attempt while /simple/
          # still lists only the previous release. Retry rather than fail the
          # one check that proves a user can install what was just published.
          for attempt in $(seq 1 30); do
            if "$PIP" download --index-url "https://$INDEX_HOST/simple/" \
              --no-deps --only-binary :all: --no-cache-dir \
              --dest "$RUNNER_TEMP/published" "psdn-sonar==$VERSION"; then
              echo "Wheel downloaded after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::$INDEX_HOST/simple/ did not list psdn-sonar $VERSION after 30 attempts"
              exit 1
            fi
            sleep 20
          done

          "$PIP" install --index-url https://pypi.org/simple/ --no-cache-dir \
            "$RUNNER_TEMP"/published/*.whl
          "$PIP" check

      # Run from RUNNER_TEMP so the import cannot resolve to a source tree.
      - name: Import the installed package
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'EOF'
          import os
          from importlib.metadata import version

          import psdn_sonar

          expected = os.environ["VERSION"]
          installed = version("psdn-sonar")
          if installed != expected:
              raise SystemExit(f"Metadata version {installed!r} != tag version {expected!r}")
          if psdn_sonar.__version__ != expected:
              raise SystemExit(f"psdn_sonar.__version__ {psdn_sonar.__version__!r} != tag version {expected!r}")

          print(f"Smoke OK: psdn-sonar {installed} imported from {psdn_sonar.__file__}")
          EOF

  github-release:
    name: Create GitHub Release
    needs: [build, publish, verify-index, smoke-test]
    # Runs even when the smoke test fails: a published version with no
    # Release (no recorded hashes, no commit binding) is exactly the
    # inconsistency this workflow exists to prevent. The smoke result is
    # recorded in the release body instead.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Record artifact checksums
        run: (cd dist && sha256sum -- *) > SHA256SUMS.txt

      # Workflow artifacts expire; Releases do not. The verification record
      # from verify-release-commit is completed with the digests of the
      # bytes actually published and attached as a durable Release asset
      # (M3-CI-01 evidence for the release gate).
      - name: Download release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence

      - name: Merge artifact digests into release evidence
        run: |
          set -euo pipefail
          jq --rawfile sums SHA256SUMS.txt \
            '.artifacts = [$sums | split("\n")[] | select(length > 0)
              | capture("^(?<sha256>[0-9a-f]{64})\\s+\\*?(?<filename>.+)$")]' \
            evidence/release-evidence.json > release-evidence.json

      # Dynamic values enter through env only — never ${{ }} inside run —
      # so a crafted tag name cannot inject into this contents:write job.
      #
      # --verify-tag below only proves the tag exists; this step proves it
      # still targets the commit the artifacts were built from. A tag
      # ruleset restricts who may move `v*`, but not when, so a tag
      # force-moved mid-run would otherwise bind this Release (and its
      # source archives) to a commit the wheel was never built from.
      - name: Verify tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
        run: |
          set -euo pipefail

          ref_json="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG")"
          sha="$(jq -r '.object.sha' <<<"$ref_json")"
          otype="$(jq -r '.object.type' <<<"$ref_json")"
          # Annotated tags point at one tag object; dereference it.
          if [ "$otype" = "tag" ]; then
            tag_json="$(gh api "repos/$GH_REPO/git/tags/$sha")"
            sha="$(jq -r '.object.sha' <<<"$tag_json")"
            otype="$(jq -r '.object.type' <<<"$tag_json")"
          fi
          if [ "$otype" != "commit" ]; then
            echo "::error::Tag $RELEASE_TAG does not resolve to a commit (got: $otype)"
            exit 1
          fi
          if [ "$sha" != "$SOURCE_COMMIT" ]; then
            echo "::error::Tag $RELEASE_TAG now points at $sha but the artifacts were built from $SOURCE_COMMIT — refusing to create a mismatched release"
            exit 1
          fi
          echo "Tag $RELEASE_TAG still points at $SOURCE_COMMIT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source-commit }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
          INDEX_RESULT: ${{ needs.verify-index.result }}
          INDEX_NAME: ${{ needs.build.outputs.index-name }}
          INDEX_HOST: ${{ needs.build.outputs.index-host }}
        run: |
          set -euo pipefail

          {
            printf '## psdn-sonar %s (%s)\n\n' "$VERSION" "$INDEX_NAME"
            printf -- '- **Source commit:** %s\n' "$SOURCE_COMMIT"
            printf -- '- **%s:** https://%s/project/psdn-sonar/%s/\n' "$INDEX_NAME" "$INDEX_HOST" "$VERSION"
            printf -- '- **Index serves the built files:** %s\n' "$INDEX_RESULT"
            printf -- '- **Smoke test:** %s\n' "$SMOKE_RESULT"
            printf -- '- **Release verification:** passed after approval (release-evidence.json)\n'
            printf -- '- **Provenance:** PEP 740 attestations published with the files\n\n'
            printf '### SHA-256 checksums\n\n```\n'
            cat SHA256SUMS.txt
            printf '```\n'
            # Machine-readable record of which index this Release describes.
            printf '\n<!-- psdn-sonar-release-index: %s -->\n' "$INDEX_NAME"
          } > "$RUNNER_TEMP/notes.md"

          # dev/a/b/rc versions must never become the repo's "Latest
          # release" (.postN alone is a full release and gets no flag).
          prerelease_args=()
          if printf '%s' "$VERSION" | grep -Eq '((a|b|rc)[0-9]+|\.dev[0-9]+)'; then
            prerelease_args=(--prerelease --latest=false)
          fi

          # Create-or-update: "re-run failed jobs" re-runs this job together
          # with a failed smoke test, so a plain `create` would collide with
          # the existing release and strand the stale smoke result in its
          # body. Editing refreshes the notes; --clobber refreshes assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Nothing stops a TestPyPI dispatch for a tag that has already
            # been released to production, and both write this one Release.
            # A rehearsal must not replace production notes and assets with
            # its own; production may still supersede a rehearsal record.
            existing_index="$(gh release view "$RELEASE_TAG" --json body --jq '.body' \
              | sed -n 's/.*psdn-sonar-release-index: \([A-Za-z]*\).*/\1/p' | tail -n 1)"
            if [ "$existing_index" = "PyPI" ] && [ "$INDEX_NAME" != "PyPI" ]; then
              echo "::notice::Release $RELEASE_TAG already records a production PyPI publish; leaving it unchanged"
              exit 0
            fi
            gh release edit "$RELEASE_TAG" \
              --title "psdn-sonar $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${prerelease_args[@]}"
            gh release upload "$RELEASE_TAG" dist/* SHA256SUMS.txt release-evidence.json --clobber
          else
            gh release create "$RELEASE_TAG" dist/* SHA256SUMS.txt release-evidence.json \
              --verify-tag \
              --title "psdn-sonar $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
