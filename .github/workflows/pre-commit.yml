name: Repo hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deduplicate superseded PR runs, but keep every push/dispatch run as evidence.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit-baseline:
    name: Pre-commit baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Tooling runtime only; the product support matrix lands with #9.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit==4.5.0

      - name: Run pre-commit baseline
        run: pre-commit run --all-files --show-diff-on-failure --color=always
